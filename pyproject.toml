[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-serving-lab"
version = "0.1.0"
description = "A small, reproducible benchmark for vLLM continuous batching, prefix caching, and paged KV cache workloads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atirian" }]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
vllm-lab-benchmark = "vllm_serving_lab.benchmark:main"
vllm-lab-summarize = "vllm_serving_lab.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
