apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gateway
  namespace: vllm-lab
  labels:
    app.kubernetes.io/name: vllm-gateway
    app.kubernetes.io/component: proxy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-gateway
        app.kubernetes.io/component: proxy
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: vllm-serving-lab-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vllm-gateway-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
