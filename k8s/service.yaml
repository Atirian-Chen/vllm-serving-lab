apiVersion: v1
kind: Service
metadata:
  name: vllm-gateway
  namespace: vllm-lab
  labels:
    app.kubernetes.io/name: vllm-gateway
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
